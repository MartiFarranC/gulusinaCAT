name: Actualitza preus

on:
  schedule:
    # Cada mitja hora entre les 5:00 i les 21:00 UTC
    - cron: "0,30 5-20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dies_enrere:
        description: "Dies anteriors que cal omplir a historic.json (0 = cap)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: actualitza-preus
  cancel-in-progress: false

jobs:
  preus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m gulusinacat preus
        env:
          DIES_ENRERE: ${{ inputs.dies_enrere || '0' }}
      - name: Desa els preus si han canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preus.json historic.json estacions.json
          if git diff --staged --quiet; then
            echo "Els preus no han canviat"
            exit 0
          fi
          git commit -m "Preus actualitzats"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
