name: Històric de 5 anys

on:
  schedule:
    # Cada dia a les 3:17 UTC: omple els mesos que faltin i afegeix els nous
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_peticions:
        description: "Màxim de mesos a demanar en aquesta execució"
        default: "30"

permissions:
  contents: write

concurrency:
  group: actualitza-preus
  cancel-in-progress: false

jobs:
  anual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m gulusinacat anual
        env:
          MAX_PETICIONS: ${{ inputs.max_peticions || '30' }}
      - name: Desa anual.json si ha canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anual.json
          if git diff --staged --quiet; then
            echo "anual.json no ha canviat"
            exit 0
          fi
          git commit -m "Històric anual actualitzat"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
