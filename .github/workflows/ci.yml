name: Comprovacions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: comprovacions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Tasques de dades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Format
        run: ruff format --check
      - name: Lint
        run: ruff check
      - name: Tipus
        run: mypy
      - name: Tests
        run: pytest --cov
      - name: Paquet
        run: pip install . && python -m gulusinacat --help

  pagina:
    name: Pàgina
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tipus
        run: npm run typecheck
      - name: Tests unitaris
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Navegador dels tests e2e
        run: npx playwright install --with-deps chromium
      - name: Tests e2e
        run: npm run test:e2e
