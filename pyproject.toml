[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gulusinacat"
version = "1.0.0"
description = "Descarrega i resumeix els preus de les benzineres de Catalunya."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gulusinacat = "gulusinacat.presentacio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "RET",
    "ARG", "ERA", "T20", "PTH", "TRY", "EM", "BLE", "S",
]
# Els textos són en català: «», · i ’ són caràcters legítims.
allowed-confusables = ["«", "»", "·", "’", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["src"]

[tool.coverage.run]
source = ["gulusinacat"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
