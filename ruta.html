<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ruta amb benzineres · On omplo el dipòsit?</title>
    <meta
      name="description"
      content="Tria d'on surts i on vas per Catalunya i Andorra, i mira les benzineres que queden a prop del camí i la més barata."
    />
    <link rel="icon" href="assets/icones/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/icones/icona-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0F1114" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Bungee&family=Figtree:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/diposit.css" />
    <link rel="stylesheet" href="assets/css/properes.css" />
    <link rel="stylesheet" href="assets/css/mapa.css" />
    <link rel="stylesheet" href="assets/css/carregant.css" />
    <link rel="stylesheet" href="assets/css/ruta.css" />
    <script type="module" src="assets/js/ruta-principal.js"></script>
  </head>
  <body class="navegacio">
    <div
      class="map nav-mapa"
      id="rMapa"
      role="region"
      aria-label="Mapa de la ruta. La mateixa informació és a la llista del panell."
    >
      <div class="map-tiles" id="rMapaRajoles" aria-hidden="true"></div>
      <svg class="map-svg" id="rMapaSvg" aria-hidden="true"></svg>
      <div class="map-pop" id="rMapaFitxa" hidden></div>
      <div class="map-ctl">
        <button type="button" id="rMapaIn" aria-label="Apropa el mapa">+</button>
        <button type="button" id="rMapaOut" aria-label="Allunya el mapa">−</button>
        <button type="button" id="rMapaFit" aria-label="Torna a centrar el mapa">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
          </svg>
        </button>
      </div>
      <div class="map-attr">
        ©
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
          >OpenStreetMap</a
        >
        · ruta d'<a href="https://project-osrm.org" target="_blank" rel="noopener">OSRM</a>
      </div>
    </div>

    <aside class="nav-panell" id="navPanell" aria-label="Ruta">
      <header class="nav-cap">
        <a class="nav-tornar" href="./" aria-label="Torna als preus de les benzineres">
          <img src="assets/icones/logo.svg" alt="" width="32" height="32" />
        </a>
        <h1>Ruta amb benzineres</h1>
      </header>

      <div class="nav-camps">
        <div class="camp">
          <label for="rOrigen">D'on surts</label>
          <div class="ruta-entrada">
            <input
              id="rOrigen"
              type="search"
              placeholder="Adreça, poble o lloc"
              autocomplete="off"
              enterkeyhint="search"
            />
            <button type="button" class="btn" id="rAqui">Des d'on soc</button>
          </div>
          <ul class="diposit-resultats" id="rOrigenOpcions" hidden></ul>
        </div>
        <div class="camp">
          <label for="rDesti">On vas</label>
          <div class="ruta-entrada">
            <input
              id="rDesti"
              type="search"
              placeholder="Adreça, poble o lloc"
              autocomplete="off"
              enterkeyhint="search"
            />
            <button
              type="button"
              class="btn"
              id="rInverteix"
              aria-label="Intercanvia d'on surts i on vas"
            >
              ⇅
            </button>
          </div>
          <ul class="diposit-resultats" id="rDestiOpcions" hidden></ul>
        </div>
        <div class="ruta-opcions">
          <div class="seg" id="rCombustible" role="group" aria-label="Combustible">
            <button type="button" data-fuel="g95" aria-pressed="true">Gasolina 95</button
            ><button type="button" data-fuel="dsl" aria-pressed="false">Dièsel</button>
          </div>
        </div>
        <div class="camp">
          <label for="rDesviacio">Desviació màxima</label>
          <div class="ruta-entrada">
            <input id="rDesviacio" type="range" min="0.5" max="20" step="0.5" value="2" />
            <output id="rDesviacioTxt" for="rDesviacio">2,0 km</output>
          </div>
        </div>
      </div>
      <p class="near-msg" id="rMsg" role="status">Tria d'on surts i on vas.</p>

      <div class="ruta-resultat" id="rResultat" hidden>
        <div class="diposit-resultat" id="rBarata" hidden></div>
        <ol class="st" id="rLlista"></ol>
        <button type="button" class="btn more" id="rMes" hidden></button>
      </div>

      <p class="nav-nota">
        Benzineres de Catalunya i Andorra que queden a prop del camí. La desviació és la distància
        en línia recta des de la ruta; no hi surten les marques que has tret al filtre de la
        <a href="./">pàgina de preus</a>.
      </p>
    </aside>
  </body>
</html>
